name: Build and push nginx-awslc

on:
    push:
        branches: [main]
        paths:
            - versions.env
            - Dockerfile.awslc
            - .github/workflows/build.yml
    schedule:
        - cron: "0 3 * * 1" # weekly rebuild for base-image security updates
    workflow_dispatch:
        inputs:
            nginx_version:
                description: "Override NGINX_VERSION (leave empty to use versions.env)"
                required: false
            aws_lc_version:
                description: "Override AWS_LC_VERSION (leave empty to use versions.env)"
                required: false

env:
    IMAGE: dburianov/nginx-awslc

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Load versions
              id: vars
              run: |
                  set -a; source versions.env; set +a
                  NGINX_VERSION="${{ github.event.inputs.nginx_version || '' }}"
                  AWS_LC_VERSION="${{ github.event.inputs.aws_lc_version || '' }}"
                  source versions.env
                  NGINX_VERSION="${{ github.event.inputs.nginx_version }}"
                  : "${NGINX_VERSION:=$(grep ^NGINX_VERSION= versions.env | cut -d= -f2)}"
                  AWS_LC_VERSION="${{ github.event.inputs.aws_lc_version }}"
                  : "${AWS_LC_VERSION:=$(grep ^AWS_LC_VERSION= versions.env | cut -d= -f2)}"
                  {
                    echo "nginx=${NGINX_VERSION}"
                    echo "awslc=${AWS_LC_VERSION}"
                    echo "date=$(date -u +%Y%m%d%H%M)"
                  } >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.awslc
                  platforms: linux/amd64,linux/arm64
                  push: true
                  build-args: |
                      NGINX_VERSION=${{ steps.vars.outputs.nginx }}
                      AWS_LC_VERSION=${{ steps.vars.outputs.awslc }}
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:${{ steps.vars.outputs.date }}
                      ${{ env.IMAGE }}:${{ steps.vars.outputs.nginx }}-${{ steps.vars.outputs.awslc }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
